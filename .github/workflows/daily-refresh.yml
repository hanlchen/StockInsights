name: Daily market data refresh

# Runs scripts/refresh_cache.py against Supabase every morning -- this is
# what keeps the dashboard (movers/sectors) and momentum screeners fresh in
# production. Deliberately NOT a Render Cron Job: Render's cron jobs are a
# paid-plan feature, and this doesn't need the backend web service to be
# awake at all -- it talks straight to Supabase over the same DATABASE_URL
# the backend uses, independent of whether the free Render instance has
# spun down. GitHub Actions' scheduled workflows are free (unlimited on
# public repos; a generous monthly minutes budget on private repos).
on:
  schedule:
    # 11:00 UTC =~ 9:30am US Eastern (8:30am Central) most of
    # the year -- adjust to taste. Cron is UTC-only and does NOT shift for
    # daylight saving, so the US-local time this actually runs at will drift
    # by an hour twice a year unless you nudge this manually.
    - cron: "30 13 * * 1-5"
  # Lets you trigger a run by hand from the Actions tab (GitHub -> Actions ->
  # "Daily market data refresh" -> "Run workflow") -- useful for testing this
  # workflow itself without waiting for the schedule, or for an ad-hoc
  # refresh after fixing a data issue.
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Comfortably under GitHub's 6-hour hard cap per job, so a run that's
    # genuinely stuck fails with a clear timeout instead of an ambiguous
    # force-kill right at the 360-minute mark.
    timeout-minutes: 340
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh computed_metrics
        env:
          # Set this in GitHub: repo -> Settings -> Secrets and variables ->
          # Actions -> New repository secret -> name it DATABASE_URL, value
          # is the same Supabase pooler connection string the Render backend
          # uses (see backend/.env.example for the exact format).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Full NYSE+NASDAQ universe (~6,000-9,000 tickers) by default, same
          # as running this locally. If this doesn't reliably finish within
          # the timeout above, the cheapest fix is to narrow scope instead of
          # raising the timeout further -- swap the line below for:
          #   python -m scripts.refresh_cache --sp500
          # which only refreshes the ~500 S&P 500 constituents (movers/
          # sectors/momentum/tickers would then only cover those, not the
          # full exchange). See scripts/refresh_cache.py's docstring.
          python -m scripts.refresh_cache

      - name: Generate AI pick of the day
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Set this in GitHub: repo -> Settings -> Secrets and variables ->
          # Actions -> New repository secret -> name it ANTHROPIC_API_KEY,
          # value from console.anthropic.com. This step is best-effort: if
          # the secret isn't set, or the API call fails, the script logs a
          # warning and exits 0 -- it will never fail this workflow or block
          # the core movers/momentum refresh above, since the AI pick is a
          # supplementary feature, not core data.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scripts.generate_recommendation
